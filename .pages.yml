# Configuração do Pages CMS (https://pagescms.org): permite publicar notícias
# e editar os dados da associação num painel, sem mexer em código.
media:
  input: public/imagens
  output: /imagens

content:
  - name: noticias
    label: Notícias
    type: collection
    path: src/content/noticias
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [titulo, data, rascunho]
      sort: [data]
      default:
        sort: data
        order: desc
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: data, label: Data, type: date, required: true }
      - { name: resumo, label: Resumo, type: text, required: true }
      - { name: imagem, label: Imagem, type: image }
      - { name: rascunho, label: Rascunho (não publicar), type: boolean, default: false }
      - { name: body, label: Texto, type: rich-text }
